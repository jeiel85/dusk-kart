<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Dusk Kart — 액션캠 카트 레이싱</title>
  <meta name="description" content="브라우저에서 바로 즐기는 3D 카트 레이싱. 헬멧 액션캠 1인칭 시점, 실제 카트 물리, 서버 없는 P2P 온라인 대전." />
  <meta name="theme-color" content="#0d1426" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1426'/%3E%3Ccircle cx='32' cy='34' r='16' fill='none' stroke='%23ff7a1a' stroke-width='6'/%3E%3Cpath d='M16 34h32' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="view"></canvas>

  <!-- In-race HUD -->
  <div id="hud" hidden>
    <div class="hud-tl">
      <div id="hud-pos"></div>
      <div id="hud-lap">LAP 1/3</div>
      <ol id="hud-board"></ol>
    </div>
    <div class="hud-tr">
      <div class="row"><span>LAP</span><b id="hud-cur">--:--.---</b></div>
      <div class="row"><span>LAST</span><b id="hud-last">--:--.---</b></div>
      <div class="row"><span>BEST</span><b id="hud-best">--:--.---</b></div>
    </div>
    <canvas id="hud-map" width="220" height="200"></canvas>
    <div class="hud-br">
      <div id="hud-speed">0</div><small>km/h</small>
      <div class="rpm"><i id="hud-rpm"></i></div>
    </div>
    <div id="hud-lights" hidden><i></i><i></i><i></i><i></i><i></i></div>
    <div id="hud-banner"></div>
    <div id="hud-toast"></div>
    <div id="hud-net" hidden></div>
    <div id="hud-keys" aria-live="polite"></div>
    <button id="hud-pause" class="icon-btn" data-i18n-attr="aria-label:aria.pause">❚❚</button>
    <button id="hud-cam" class="icon-btn" data-i18n-attr="aria-label:aria.cam">🎥</button>
    <button id="hud-orient" class="icon-btn" data-i18n-attr="aria-label:aria.orient" hidden>🔄</button>
  </div>

  <!-- Touch controls (shown on touch devices) -->
  <div id="touch" hidden>
    <div data-touch="steer" class="t-steer"><span></span></div>
    <div data-touch="brake" class="t-btn t-brake">BRAKE</div>
    <div data-touch="gas" class="t-btn t-gas">GAS</div>
  </div>

  <!-- Menus -->
  <div id="ui">
    <section id="scr-main" class="panel">
      <h1><span>DUSK</span> KART</h1>
      <p class="tag" data-i18n="main.tag"></p>
      <div class="mode-box">
        <span data-i18n="main.mode"></span>
        <div id="mode-pick" class="seg" role="group" data-i18n-attr="aria-label:aria.mode"></div>
        <p id="mode-hint" class="note"></p>
      </div>
      <div class="mode-box">
        <span data-i18n="main.track"></span>
        <div id="track-pick" class="seg" role="group" data-i18n-attr="aria-label:aria.track"></div>
        <p id="track-hint" class="note"></p>
      </div>
      <div class="mode-box">
        <span data-i18n="main.weather"></span>
        <div id="weather-pick" class="seg" role="group" data-i18n-attr="aria-label:aria.weather"></div>
        <p id="weather-hint" class="note"></p>
      </div>
      <div class="menu">
        <button data-go="race" data-i18n-html="main.race"></button>
        <button data-go="trial" data-i18n-html="main.trial"></button>
        <button data-go="online" data-i18n-html="main.online"></button>
        <div class="menu-row">
          <button data-go="settings" class="ghost" data-i18n="main.settings"></button>
          <button data-go="help" class="ghost" data-i18n="main.help"></button>
          <button id="btn-lang" class="ghost" data-i18n="main.lang"></button>
        </div>
      </div>
    </section>

    <section id="scr-online" class="panel" hidden>
      <h2 data-i18n="online.title"></h2>
      <label><span data-i18n="online.name"></span> <input id="in-name" maxlength="14" autocomplete="off" /></label>
      <label><span data-i18n="online.color"></span> <span id="colors" class="swatches"></span></label>
      <label><span data-i18n="online.room"></span> <input id="in-room" maxlength="5" autocomplete="off" data-i18n-attr="placeholder:online.roomPlaceholder" style="text-transform:uppercase" /></label>
      <p class="note" data-i18n="online.note"></p>
      <p class="note warn" id="online-error" role="alert" hidden></p>
      <div class="menu-row">
        <button id="btn-join" data-i18n="online.join"></button>
        <button data-go="main" class="ghost" data-i18n="back"></button>
      </div>
    </section>

    <section id="scr-lobby" class="panel" hidden>
      <h2><span data-i18n="lobby.title"></span> <code id="lobby-code"></code></h2>
      <p class="note" id="lobby-status" data-i18n="lobby.connecting"></p>
      <ul id="lobby-list"></ul>
      <div class="menu-row">
        <button id="btn-copy" class="ghost" data-i18n="lobby.copy"></button>
        <button id="btn-start" data-i18n="lobby.start"></button>
      </div>
      <div id="invite-box" hidden>
        <p class="note warn" data-i18n="lobby.copyManual"></p>
        <input id="invite-url" readonly />
      </div>
      <div class="menu-row">
        <button id="btn-freeroam" class="ghost" data-i18n="lobby.freeroam"></button>
        <button id="btn-leave" class="ghost" data-i18n="lobby.leave"></button>
      </div>
      <div class="menu-row">
        <button id="btn-rejoin" class="ghost" data-i18n="lobby.rejoin" data-i18n-attr="title:lobby.rejoinTitle"></button>
      </div>
      <details id="net-diag">
        <summary data-i18n="lobby.diag"></summary>
        <div id="net-diag-body"></div>
      </details>
    </section>

    <section id="scr-settings" class="panel" hidden>
      <h2 data-i18n="set.title"></h2>
      <label><span data-i18n="set.camera"></span>
        <select id="set-camera">
          <option value="helmet" data-i18n="cam.helmetFull"></option>
          <option value="chase" data-i18n="cam.chase"></option>
          <option value="far" data-i18n="cam.far"></option>
        </select>
      </label>
      <label><span data-i18n="set.blur"></span> <input id="set-blur" type="range" min="0" max="1.5" step="0.1" /></label>
      <label><span data-i18n="set.shake"></span> <input id="set-shake" type="range" min="0" max="1.5" step="0.1" /></label>
      <label class="check"><input id="set-lens" type="checkbox" /> <span data-i18n="set.lens"></span></label>
      <label><span data-i18n="set.mode"></span>
        <select id="set-mode">
          <option value="easy" data-i18n="set.mode.easy"></option>
          <option value="normal" data-i18n="set.mode.normal"></option>
          <option value="real" data-i18n="set.mode.real"></option>
        </select>
      </label>
      <label><span data-i18n="set.volume"></span> <input id="set-volume" type="range" min="0" max="1" step="0.05" /></label>
      <label><span data-i18n="set.quality"></span>
        <select id="set-quality">
          <option value="auto" data-i18n="set.quality.auto"></option>
          <option value="high" data-i18n="quality.high"></option>
          <option value="medium" data-i18n="quality.medium"></option>
          <option value="low" data-i18n="set.quality.lowFull"></option>
        </select>
      </label>
      <label class="touch-only"><span data-i18n="set.orient"></span>
        <select id="set-orient">
          <option value="auto" data-i18n="orient.auto"></option>
          <option value="landscape" data-i18n="set.orient.landscape"></option>
          <option value="portrait" data-i18n="set.orient.portrait"></option>
        </select>
      </label>
      <p class="note" data-i18n-html="set.note"></p>
      <div class="menu-row"><button data-back data-i18n="ok"></button></div>
    </section>

    <section id="scr-help" class="panel" hidden>
      <h2 data-i18n="help.title"></h2>
      <table class="keys">
        <tr><td data-i18n="help.gas"></td><td><kbd>W</kbd> / <kbd>↑</kbd> · <span data-i18n="help.padRT"></span></td></tr>
        <tr><td data-i18n="help.brake"></td><td><kbd>S</kbd> / <kbd>↓</kbd> / <kbd>Space</kbd> · <span data-i18n="help.padLT"></span></td></tr>
        <tr><td data-i18n="help.steer"></td><td><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> · <span data-i18n="help.stick"></span></td></tr>
        <tr><td data-i18n="help.cam"></td><td><kbd>C</kbd> · <span data-i18n="help.padY"></span></td></tr>
        <tr><td data-i18n="help.reset"></td><td><kbd>R</kbd> · <span data-i18n="help.padBack"></span></td></tr>
        <tr><td data-i18n="help.pause"></td><td><kbd>Esc</kbd> / <kbd>P</kbd> · <span data-i18n="help.padStart"></span></td></tr>
        <tr><td data-i18n="help.mute"></td><td><kbd>M</kbd></td></tr>
        <tr><td data-i18n="help.keys"></td><td><kbd>H</kbd> / <kbd>F1</kbd></td></tr>
        <tr><td data-i18n="help.touch"></td><td data-i18n-html="help.touchHow"></td></tr>
      </table>
      <p class="note" data-i18n-html="help.note"></p>
      <div class="menu-row"><button data-back data-i18n="ok"></button></div>
    </section>

    <section id="scr-pause" class="panel" hidden>
      <h2 data-i18n="pause.title"></h2>
      <div class="menu">
        <button id="btn-resume" data-i18n="pause.resume"></button>
        <button id="btn-restart" class="ghost" data-i18n="pause.restart"></button>
        <button data-go="help" class="ghost" data-i18n="main.help"></button>
        <button data-go="settings" class="ghost" data-i18n="main.settings"></button>
        <button id="btn-quit" class="ghost" data-i18n="menu"></button>
      </div>
    </section>

    <section id="scr-results" class="panel" hidden>
      <h2 id="res-title" data-i18n="res.title"></h2>
      <table id="res-table"></table>
      <div class="menu-row">
        <button id="btn-again" data-i18n="res.again"></button>
        <button id="btn-menu" class="ghost" data-i18n="menu"></button>
      </div>
    </section>
  </div>

  <div id="boot" data-i18n="boot">…</div>
  <div id="gl-lost" hidden>
    <p data-i18n="gl.lost"></p>
    <button type="button" data-i18n="gl.reload" hidden></button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
